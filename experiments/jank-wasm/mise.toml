[tools]
zig = "0.17.1"

[tasks.native]
description = "Run the native jank and Zig interoperability checks"
run = "bash scripts/check-jank.sh"

[tasks.zig-cpp]
description = "Compile and link generated jank C++ with Zig"
run = "bash scripts/check-jank-zig-cpp.sh"

[tasks.wasm]
description = "Test minimal C++ and Zig modules on wasm32 and wasm64"
run = "bash scripts/check-cpp-zig-wasm.sh"
